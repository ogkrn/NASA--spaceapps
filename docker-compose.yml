services:
  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    restart: unless-stopped
